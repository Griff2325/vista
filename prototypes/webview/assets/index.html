function showInputs(inputs){panel('TV inputs','<div class="all-grid" id="inputGrid"></div>');if(!inputs.length){document.getElementById('panelContent').innerHTML='<p>Use the Input button on your TV remote to switch inputs.</p>';return}inputs.forEach(a=>{let b=document.createElement('button');b.textContent=a.name;b.onclick=()=>native('openInput',a.id);document.getElementById('inputGrid').append(b)});document.querySelector('#inputGrid button')?.focus()}
function ambient(){document.body.classList.add('ambient-mode');document.activeElement.blur()}
function tick(){let d=new Date();document.getElementById('clock').innerHTML=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/ (AM|PM)/,'<small>$1</small>');document.getElementById('greeting').textContent=d.getHours()<12?'Good morning.':d.getHours()<18?'Good afternoon.':'Good evening.';document.getElementById('date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}tick();setInterval(tick,30000);
document.addEventListener('keydown',e=>{if(document.body.classList.contains('ambient-mode')){e.preventDefault();document.body.classList.remove('ambient-mode');focusFirst();return}if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closePanel();return}if(e.key==='Enter'){if(document.activeElement.tagName==='BUTTON'){e.preventDefault();document.activeElement.click()}return}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();let modal=document.getElementById('panel').classList.contains('open');let all=[...document.querySelectorAll(modal?'.panel button':'.shell button')].filter(b=>b.offsetWidth&&b.offsetHeight);let from=document.activeElement;if(!all.includes(from)){all[0]?.focus();return}let r=from.getBoundingClientRect(),x=r.x+r.width/2,y=r.y+r.height/2;let vertical=e.key==='ArrowUp'||e.key==='ArrowDown',positive=e.key==='ArrowDown'||e.key==='ArrowRight';let scored=all.filter(b=>b!==from).map(b=>{let q=b.getBoundingClientRect(),dx=q.x+q.width/2-x,dy=q.y+q.height/2-y,main=vertical?dy:dx,cross=vertical?dx:dy;return{b,main,cross,score:Math.abs(main)+Math.abs(cross)*2.6}}).filter(o=>positive?o.main>8:o.main< -8).sort((a,b)=>a.score-b.score);if(scored[0]){scored[0].b.focus();scored[0].b.scrollIntoView({block:'nearest',inline:'nearest'})}});
setFavorites(pkgs.map((pkg,i)=>({pkg,name:labels[i]})));if(!window.TV){setContinue({available:true,items:[]});weatherUnavailable()}
</script></body></html>
