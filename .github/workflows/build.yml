name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build components
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          (set +o pipefail; yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Check script syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          sh -n bridge/supervisor.sh
          python3 -X pycache_prefix=build/pycache -m py_compile bridge/pack-arm.py scripts/measure.py
      - name: Test Cincinnati lighting and calendar boundaries
        run: bash scripts/test-sky.sh
      - name: Build and verify development APK
        run: bash scripts/build-app.sh
      - name: Assemble static remote bridge
        run: bash scripts/build-bridge.sh
      - name: Store development build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sol-home-development
          path: |
            build/sol-home-debug.apk
            build/bridge/sol-home-bridge
          retention-days: 7
